[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggriculture-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["jsonschema==4.26.0", "requests==2.34.2", "numpy==2.5.3", "PyYAML==6.0.3"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["agent*", "arena*", "eval*", "experiments*", "submission*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
